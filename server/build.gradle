plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seoulmate'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// Google 이 운영하는 Maven Central 미러를 먼저 쓴다.
	// Render 무료 빌드 서버는 IP 를 여럿이 나눠 써서 Maven Central 이 429(Too Many Requests)로 막을 때가 있다
	maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
	// Google 미러에 아직 없는 파일은 두 번째 미러(Maven Central 전체 프록시)에서
	maven { url = 'https://maven.aliyun.com/repository/public' }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// DB 마이그레이션 (src/main/resources/db/migration)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Swagger UI (/swagger-ui.html). Boot 4 는 springdoc 3.x 필요. 빌드가 안 되면 이 줄만 주석 처리
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 배포 이미지 빌드용: 컴파일·실행에 필요한 jar 를 미리 받아 둔다.
// Dockerfile 에서 소스를 복사하기 전에 실행하므로, build.gradle 이 그대로면 다음 배포부터는 다시 받지 않는다
tasks.register('downloadDependencies') {
	def compile = configurations.compileClasspath
	def runtime = configurations.runtimeClasspath
	def processors = configurations.annotationProcessor
	inputs.files(compile, runtime, processors)
	doLast {
		println "dependencies ready: ${compile.files.size()} compile, ${runtime.files.size()} runtime jars"
	}
}
