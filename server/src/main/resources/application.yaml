# 비밀 값은 여기 쓰지 않는다. server/.env (커밋 금지) 또는 배포 환경변수로 넣는다.
spring:
  application:
    name: server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5        # Supabase Session pooler 연결 수 제한
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway(db/migration)가 관리. 엔티티와 DB가 다르면 서버가 안 뜬다
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase public 스키마에 기본 객체가 있어도 멈추지 않게: 기록 표가 없으면 0번으로 기준을 잡고 V1부터 실행
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

seoulmate:
  demo-mode: ${DEMO_MODE:false}
  llm:                          # AI 번역 (서버 B). 키가 비어 있으면 번역을 건너뛴다
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-5.4-nano}
    base-url: https://api.openai.com/v1
    timeout-seconds: 20
  supabase:
    issuer: ${SUPABASE_JWT_ISSUER}
    jwks-url: ${SUPABASE_JWKS_URL}
  policy:
    mate-list-page-size: 20
    mate-max-active-matches: 10
    map-min-spots: 5
    map-preview-spots: 2
    chat-unlock-ratio: 0.5
    visit-radius-meters: 200
    max-match-slots: 5          # 여행자 무료 매칭 칸 (ERD v2.5)
    max-tags: 10
    min-age: 18
